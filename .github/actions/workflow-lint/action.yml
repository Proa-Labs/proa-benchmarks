name: Workflow lint
description: Install the pinned actionlint release and validate GitHub workflows

runs:
  using: composite
  steps:
    - name: Install pinned actionlint
      shell: bash
      run: |
        set -euo pipefail
        version=1.7.7
        checksum=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        directory="$(mktemp -d)"
        archive="$directory/actionlint.tar.gz"
        curl --fail --silent --show-error --location \
          --proto '=https' --tlsv1.2 \
          --output "$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
        printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$directory" actionlint
        echo "ACTIONLINT=$directory/actionlint" >> "$GITHUB_ENV"

    - name: Lint workflows and embedded shell
      shell: bash
      run: "$ACTIONLINT"
