<title id="ttl">Server-render latency relative to Proa — September 5, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Each dot is the median of five process P50s on a logarithmic axis. All cells passed DOM parity. 17 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 2 µs, 1×; 1,000-row table: 250 µs, 1×; Product grid: 26 µs, 1×. Marko — Component page: 7.08 µs, 3.54×; 1,000-row table: 920 µs, 3.64×; Product grid: 82 µs, 3.16×. React — Component page: 70.9 µs, 35.4×; 1,000-row table: 3.34 ms, 13.2×; Product grid: 390 µs, 15×. Vue — Component page: 6.88 µs, 3.44×; 1,000-row table: 1.11 ms, 4.38×; Product grid: 81 µs, 3.12×. Svelte — Component page: 10.2 µs, 5.08×; 1,000-row table: 930 µs, 3.7×; Product grid: 83 µs, 3.22×. Rails — Component page: 58 µs, 29×; 1,000-row table: 5.85 ms, 23.2×; Product grid: 400 µs, 15.4×. jte — Component page: 8.04 µs, 4.02×; 1,000-row table: 2.03 ms, 8.03×; Product grid: 220 µs, 8.55×. Rocker — Component page: 14.6 µs, 7.31×; 1,000-row table: 2.27 ms, 8.99×; Product grid: 350 µs, 13.4×. Handlebars — Component page: 18.6 µs, 9.29×; 1,000-row table: 2.22 ms, 8.79×; Product grid: 200 µs, 7.72×. Go html/template — Component page: 83.1 µs, 41.6×; 1,000-row table: 8.14 ms, 32.2×; Product grid: 640 µs, 24.6×. Jinja2 — Component page: 93.1 µs, 46.6×; 1,000-row table: 14.9 ms, 58.9×; Product grid: 1.23 ms, 47.5×. PHP — Component page: 34.2 µs, 17.1×; 1,000-row table: 1.39 ms, 5.5×; Product grid: 84 µs, 3.25×. Askama — Component page: 1.42 µs, 0.71×; 1,000-row table: 580 µs, 2.3×; Product grid: 22 µs, 0.87×. Sailfish — Component page: 2.29 µs, 1.15×; 1,000-row table: 530 µs, 2.11×; Product grid: 24 µs, 0.94×. Leptos — Component page: 21.8 µs, 10.9×; 1,000-row table: 1.78 ms, 7.07×; Product grid: 220 µs, 8.33×. Dioxus — Component page: 106 µs, 52.9×; 1,000-row table: 2.2 ms, 8.7×; Product grid: 300 µs, 11.6×. Topcoat — Component page: 12.2 µs, 6.1×; 1,000-row table: 1.02 ms, 4.05×; Product grid: 150 µs, 5.72×.</desc>
