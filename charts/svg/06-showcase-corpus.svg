<svg xmlns="http://www.w3.org/2000/svg" width="980" height="397" viewBox="0 0 980 397" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Linked showcase corpus render latency</title>
<desc id="dsc">Airbnb home: P50 13 µs (95% CI 13 µs to 13 µs), pooled P95 13.5 µs, 162,800 bytes, 50,000 recorded renders, raw bytes stable. Airbnb search: P50 3.33 µs (95% CI 3.17 µs to 3.42 µs), pooled P95 3.54 µs, 49,913 bytes, 50,000 recorded renders, raw bytes stable. Airbnb listing: P50 17.3 µs (95% CI 17.1 µs to 17.3 µs), pooled P95 18.3 µs, 95,588 bytes, 50,000 recorded renders, raw bytes not stable. Nike catalog: P50 19.3 µs (95% CI 19.3 µs to 19.4 µs), pooled P95 20 µs, 128,211 bytes, 50,000 recorded renders, raw bytes stable. Nike product: P50 5.13 µs (95% CI 5 µs to 5.25 µs), pooled P95 5.63 µs, 58,959 bytes, 50,000 recorded renders, raw bytes stable. eBay cards, 60 listings: P50 35.2 µs (95% CI 35 µs to 35.3 µs), pooled P95 36.4 µs, 240,785 bytes, 50,000 recorded renders, raw bytes stable. eBay chrome, 60 listings: P50 48 µs (95% CI 47.8 µs to 48.1 µs), pooled P95 50.2 µs, 522,876 bytes, 50,000 recorded renders, raw bytes stable. eBay real chrome, 60 listings: P50 60.7 µs (95% CI 60.7 µs to 61.1 µs), pooled P95 64.4 µs, 794,776 bytes, 50,000 recorded renders, raw bytes stable. ESPN game page: P50 7.83 µs (95% CI 7.75 µs to 8 µs), pooled P95 8.25 µs, 33,618 bytes, 50,000 recorded renders, raw bytes stable. Sentry OTel, 400 rows: P50 130 µs (95% CI 130 µs to 135 µs), pooled P95 136 µs, 875,334 bytes, 1,500 recorded renders, raw bytes stable. Settings console: P50 2.88 µs (95% CI 2.83 µs to 2.96 µs), pooled P95 3.25 µs, 7,860 bytes, 50,000 recorded renders, raw bytes stable.</desc>
