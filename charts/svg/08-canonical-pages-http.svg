<title id="ttl">Proa, React, Marko, Go html/template and SvelteKit serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 87,426 responses per second, 0.011 ms CPU per response, 8.1 MiB peak RSS. React on the Component page: 9,426 responses per second, 0.112 ms CPU per response, 240.8 MiB peak RSS. Marko on the Component page: 39,348 responses per second, 0.027 ms CPU per response, 227.4 MiB peak RSS. Go html/template on the Component page: 7,407 responses per second, 0.135 ms CPU per response, 19.1 MiB peak RSS. SvelteKit on the Component page: 9,693 responses per second, 0.122 ms CPU per response, 392.1 MiB peak RSS. Proa on the Product grid: 17,838 responses per second, 0.056 ms CPU per response, 9.3 MiB peak RSS. React on the Product grid: 1,614 responses per second, 0.635 ms CPU per response, 312.0 MiB peak RSS. Marko on the Product grid: 4,507 responses per second, 0.244 ms CPU per response, 375.5 MiB peak RSS. Go html/template on the Product grid: 1,055 responses per second, 0.949 ms CPU per response, 18.3 MiB peak RSS. SvelteKit on the Product grid: 1,458 responses per second, 0.851 ms CPU per response, 547.0 MiB peak RSS. Proa on the 1,000-row table: 2,957 responses per second, 0.338 ms CPU per response, 71.2 MiB peak RSS. React on the 1,000-row table: 189 responses per second, 5.413 ms CPU per response, 442.0 MiB peak RSS. Marko on the 1,000-row table: 564 responses per second, 1.689 ms CPU per response, 303.0 MiB peak RSS. Go html/template on the 1,000-row table: 69 responses per second, 12.425 ms CPU per response, 20.0 MiB peak RSS. SvelteKit on the 1,000-row table: 121 responses per second, 8.440 ms CPU per response, 466.4 MiB peak RSS.</desc>
