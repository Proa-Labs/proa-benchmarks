<svg xmlns="http://www.w3.org/2000/svg" width="980" height="615" viewBox="0 0 980 615" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Proa, React, Marko and Go html/template serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 89,890 responses per second, 0.011 ms CPU per response, 8.2 MiB peak RSS. React on the Component page: 9,205 responses per second, 0.115 ms CPU per response, 241.1 MiB peak RSS. Marko on the Component page: 40,393 responses per second, 0.026 ms CPU per response, 228.2 MiB peak RSS. Go html/template on the Component page: 7,400 responses per second, 0.136 ms CPU per response, 19.3 MiB peak RSS. Proa on the Product grid: 16,100 responses per second, 0.061 ms CPU per response, 9.4 MiB peak RSS. React on the Product grid: 1,604 responses per second, 0.634 ms CPU per response, 305.6 MiB peak RSS. Marko on the Product grid: 4,612 responses per second, 0.237 ms CPU per response, 389.9 MiB peak RSS. Go html/template on the Product grid: 1,003 responses per second, 0.995 ms CPU per response, 18.4 MiB peak RSS. Proa on the 1,000-row table: 2,742 responses per second, 0.364 ms CPU per response, 56.8 MiB peak RSS. React on the 1,000-row table: 197 responses per second, 5.326 ms CPU per response, 439.9 MiB peak RSS. Marko on the 1,000-row table: 664 responses per second, 1.544 ms CPU per response, 329.4 MiB peak RSS. Go html/template on the 1,000-row table: 88 responses per second, 11.272 ms CPU per response, 22.8 MiB peak RSS.</desc>
