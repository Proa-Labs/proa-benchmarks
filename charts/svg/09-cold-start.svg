<svg xmlns="http://www.w3.org/2000/svg" width="980" height="259" viewBox="0 0 980 259" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Cold start to first product-grid response for Proa, React, Marko and Go html/template</title>
<desc id="dsc">Wall time includes process creation, runtime and module loading, fixture construction and the first render. Fifteen fresh processes per engine on one host. Proa: 8.63 ms median, 10.8 ms P95, 11.4 ms slowest, 4.5 MiB after the first response. React: 69 ms median, 76.5 ms P95, 77.1 ms slowest, 75.9 MiB after the first response. Marko: 57 ms median, 63.2 ms P95, 63.6 ms slowest, 63 MiB after the first response. Go html/template: 15.2 ms median, 17.5 ms P95, 17.6 ms slowest, 12.5 MiB after the first response.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .t   { font-size: 17px; font-weight: 600; fill: #0b0b0b; letter-spacing: -.005em; }
  .d   { font-size: 12.5px; font-weight: 400; fill: #52514e; }
  .eb  { font-size: 10.5px; font-weight: 600; fill: #898781; letter-spacing: .09em; }
  .cat { font-size: 12px; font-weight: 400; fill: #52514e; }
  .catb{ font-size: 12px; font-weight: 600; fill: #0b0b0b; }
  .lg  { font-size: 12px; font-weight: 400; fill: #52514e; }
  .tick{ font-size: 10.5px; font-weight: 400; fill: #898781; font-variant-numeric: tabular-nums; }
  .val { font-size: 11px; font-weight: 500; fill: #52514e; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valb{ font-size: 11px; font-weight: 600; fill: #0b0b0b; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valw{ font-size: 11px; font-weight: 600; fill: #fcfcfb; font-variant-numeric: tabular-nums; }
  .note{ font-size: 10px; font-weight: 400; fill: #898781; }
  .mono{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .end { text-anchor: end; }
  .mid { text-anchor: middle; }
</style>
<rect width="980" height="259" fill="#fcfcfb"/>
<text x="34" y="44" class="t">Cold start to first response</text><text x="34" y="61" class="d">Spawn to complete product-grid response · 15 fresh processes per engine</text><rect x="34" y="78" width="11" height="11" rx="2.5" fill="#8f8d84"/><text x="51" y="87" class="lg">P50</text><path d="M98.4 78.5L98.4 88.5" stroke="#0b0b0b" stroke-width="1.5"/><text x="108.4" y="87" class="lg">P95</text><circle cx="155.79" cy="83.5" r="4" fill="#fcfcfb" stroke="#8f8d84" stroke-width="1.8"/><text x="165.79" y="87" class="lg">Max</text><text x="34" y="109" class="eb">RESPONSE TIME · LOWER IS BETTER</text><text x="780" y="109" class="eb">RSS AFTER RESPONSE</text><path d="M152 121L152 223" stroke="#e6e4dc" stroke-width="1"/><text x="152" y="237" class="tick mid">0</text><path d="M303 121L303 223" stroke="#e6e4dc" stroke-width="1"/><text x="303" y="237" class="tick mid">25 ms</text><path d="M454 121L454 223" stroke="#e6e4dc" stroke-width="1"/><text x="454" y="237" class="tick mid">50 ms</text><path d="M605 121L605 223" stroke="#e6e4dc" stroke-width="1"/><text x="605" y="237" class="tick mid">75 ms</text><path d="M756 121L756 223" stroke="#e6e4dc" stroke-width="1"/><text x="756" y="237" class="tick mid">100 ms</text><text x="136" y="138.5" class="catb end">Proa</text><path d="M152 127H201.13a3 3 0 0 1 3 3V138a3 3 0 0 1 -3 3H152Z" fill="#2a78d6"/><path d="M217.23 126L217.23 142" stroke="#0b0b0b" stroke-width="1.5"/><circle cx="220.86" cy="134" r="3.2" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/><text x="229.86" y="138.5" class="valb">8.63 ms</text><text x="780" y="138.5" class="valb">4.5 MiB</text><text x="136" y="164.5" class="cat end">React</text><path d="M152 153H565.76a3 3 0 0 1 3 3V164a3 3 0 0 1 -3 3H152Z" fill="#8f8d84"/><path d="M614.06 152L614.06 168" stroke="#0b0b0b" stroke-width="1.5"/><circle cx="617.68" cy="160" r="3.2" fill="#fcfcfb" stroke="#8f8d84" stroke-width="1.5"/><text x="626.68" y="164.5" class="val">69 ms</text><text x="780" y="164.5" class="val">75.9 MiB</text><text x="136" y="190.5" class="cat end">Marko</text><path d="M152 179H493.28a3 3 0 0 1 3 3V190a3 3 0 0 1 -3 3H152Z" fill="#8f8d84"/><path d="M533.73 178L533.73 194" stroke="#0b0b0b" stroke-width="1.5"/><circle cx="536.14" cy="186" r="3.2" fill="#fcfcfb" stroke="#8f8d84" stroke-width="1.5"/><text x="545.14" y="190.5" class="val">57 ms</text><text x="780" y="190.5" class="val">63 MiB</text><text x="136" y="216.5" class="cat end">Go html/template</text><path d="M152 205H240.81a3 3 0 0 1 3 3V216a3 3 0 0 1 -3 3H152Z" fill="#8f8d84"/><path d="M257.7 204L257.7 220" stroke="#0b0b0b" stroke-width="1.5"/><circle cx="258.3" cy="212" r="3.2" fill="#fcfcfb" stroke="#8f8d84" stroke-width="1.5"/><text x="267.3" y="216.5" class="val">15.2 ms</text><text x="780" y="216.5" class="val">12.5 MiB</text><path d="M152 121L152 223" stroke="#c3c2b7" stroke-width="1"/>
</svg>
