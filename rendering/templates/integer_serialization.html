<html lang="en"><head><title>Integer serialization</title></head><body><table><thead><tr><th>id</th><th>delta</th><th>quantity</th><th>inventory</th><th>epoch</th><th>shard</th><th>attempts</th><th>checksum</th></tr></thead><tbody>{% for row in rows %}<tr data-id="{{ row.id }}" data-shard="{{ row.shard }}"><td>{{ row.id }}</td><td>{{ row.signed_delta }}</td><td>{{ row.quantity }}</td><td>{{ row.inventory }}</td><td>{{ row.epoch_seconds }}</td><td>{{ row.shard }}</td><td>{{ row.attempts }}</td><td>{{ row.checksum }}</td></tr>{% endfor %}</tbody></table></body></html>
