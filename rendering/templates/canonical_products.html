<main class="mx-auto w-full max-w-6xl px-4 py-10"><h1 class="text-2xl font-bold tracking-tight">All products</h1><div class="mt-6 grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">{% for product in products %}<a href="{{ product.href }}" class="group flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md"><div class="mb-4 flex h-32 items-center justify-center rounded-lg bg-slate-100 text-3xl font-bold text-slate-300">{{ product.category }}</div><p class="text-xs font-medium uppercase tracking-wide text-slate-400">{{ product.category }}</p><h3 class="mt-1 text-sm font-semibold text-slate-900 group-hover:text-indigo-600">{{ product.name }}</h3><div class="mt-2 flex items-center gap-1"><div class="flex">{% for index in 0..5 %}<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="{% if index < product.filled_stars %}h-4 w-4 text-amber-400{% else %}h-4 w-4 text-slate-200{% endif %}"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.539 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.783.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.363-1.118l-2.8-2.034c-.784-.57-.381-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>{% endfor %}</div><span class="text-xs text-slate-500">{{ product.rating }} ({{ product.review_count }})</span></div><p class="mt-3 text-lg font-bold">{{ product.price }}</p></a>{% endfor %}</div></main>
